name: Unity CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  core-tests:
    name: Core logic tests (dotnet, no Unity needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run core test suite
        run: dotnet test tooling/CoreTests/CoreTests.csproj

  yaml-lint:
    name: Unity YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint hand-written serialized files
        run: python3 tooling/lint_unity_yaml.py

  # Decides whether a COMPLETE Unity activation strategy is configured.
  # GameCI ALWAYS needs the Unity account credentials to reach the licensing
  # servers, plus proof of licence:
  #   UNITY_EMAIL + UNITY_PASSWORD + (UNITY_LICENSE for Personal, or UNITY_SERIAL for Pro)
  # A .ulf on its own is NOT sufficient. A partial set fails loudly here rather
  # than dying deep inside the Unity container with an opaque message.
  licence-check:
    name: Unity licence configuration
    runs-on: ubuntu-latest
    outputs:
      usable: ${{ steps.check.outputs.usable }}
    steps:
      - name: Inspect configured secrets
        id: check
        env:
          HAS_ULF: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          echo "Secret presence (values are never printed):"
          echo "  UNITY_LICENSE  : $HAS_ULF"
          echo "  UNITY_SERIAL   : $HAS_SERIAL"
          echo "  UNITY_EMAIL    : $HAS_EMAIL"
          echo "  UNITY_PASSWORD : $HAS_PASSWORD"

          # Account credentials are required for BOTH strategies — GameCI has to
          # talk to Unity's licensing servers regardless of licence type.
          if [ "$HAS_EMAIL" = "true" ] && [ "$HAS_PASSWORD" = "true" ]; then
            if [ "$HAS_ULF" = "true" ]; then
              echo "Strategy: Personal licence (.ulf + account)."
              echo "usable=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$HAS_SERIAL" = "true" ]; then
              echo "Strategy: Professional licence (serial + account)."
              echo "usable=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          if [ "$HAS_ULF" != "true" ] && [ "$HAS_SERIAL" != "true" ] \
             && [ "$HAS_EMAIL" != "true" ] && [ "$HAS_PASSWORD" != "true" ]; then
            echo "::notice::No Unity licence secrets configured — skipping the headless Unity jobs."
            echo "usable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "usable=false" >> "$GITHUB_OUTPUT"
          echo "::error::Unity licence secrets are incomplete."
          echo ""
          echo "Add these in Settings -> Secrets and variables -> Actions."
          echo "UNITY_EMAIL and UNITY_PASSWORD are required for EVERY licence type:"
          echo ""
          echo "  Free Personal licence:  UNITY_EMAIL + UNITY_PASSWORD + UNITY_LICENSE"
          echo "                          (UNITY_LICENSE = entire contents of your .ulf file)"
          echo ""
          echo "  Paid Pro/Plus licence:  UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL"
          echo ""
          echo "See https://game.ci/docs/github/activation"
          exit 1

  unity-tests:
    name: EditMode tests (headless Unity editor)
    runs-on: ubuntu-latest
    needs: licence-check
    if: needs.licence-check.outputs.usable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-tests-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: unity-library-tests-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.22f1
          testMode: EditMode

  # Building the Android APK lives in .github/workflows/release-apk.yml, triggered
  # on demand. An IL2CPP Android build takes ~30-40 minutes; running it on every
  # push would exhaust a free Actions quota within a handful of commits.
