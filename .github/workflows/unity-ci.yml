name: Unity CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  core-tests:
    name: Core logic tests (dotnet, no Unity needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run core test suite
        run: dotnet test tooling/CoreTests/CoreTests.csproj

  yaml-lint:
    name: Unity YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint hand-written serialized files
        run: python3 tooling/lint_unity_yaml.py

  # Decides whether a COMPLETE Unity activation strategy is configured.
  # GameCI accepts either a Personal licence (UNITY_LICENSE = full .ulf contents)
  # or a Pro/Plus serial (UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD together).
  # A partial set is a misconfiguration and fails loudly here rather than dying
  # deep inside the Unity container with an opaque message.
  licence-check:
    name: Unity licence configuration
    runs-on: ubuntu-latest
    outputs:
      usable: ${{ steps.check.outputs.usable }}
    steps:
      - name: Inspect configured secrets
        id: check
        env:
          HAS_ULF: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          echo "Secret presence (values are never printed):"
          echo "  UNITY_LICENSE  : $HAS_ULF"
          echo "  UNITY_SERIAL   : $HAS_SERIAL"
          echo "  UNITY_EMAIL    : $HAS_EMAIL"
          echo "  UNITY_PASSWORD : $HAS_PASSWORD"

          # Personal licence: the .ulf alone is enough, but a stray UNITY_SERIAL
          # makes GameCI pick the professional path and demand email + password.
          if [ "$HAS_ULF" = "true" ] && [ "$HAS_SERIAL" != "true" ]; then
            echo "Strategy: Personal licence (UNITY_LICENSE)."
            echo "usable=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "$HAS_SERIAL" = "true" ] && [ "$HAS_EMAIL" = "true" ] && [ "$HAS_PASSWORD" = "true" ]; then
            echo "Strategy: Professional licence (serial + account)."
            echo "usable=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "$HAS_ULF" != "true" ] && [ "$HAS_SERIAL" != "true" ] \
             && [ "$HAS_EMAIL" != "true" ] && [ "$HAS_PASSWORD" != "true" ]; then
            echo "::notice::No Unity licence secrets configured — skipping the headless Unity jobs."
            echo "usable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "usable=false" >> "$GITHUB_OUTPUT"
          echo "::error::Unity licence secrets are incomplete."
          echo ""
          echo "Fix one of these two ways in Settings -> Secrets and variables -> Actions:"
          echo ""
          echo "  A) Free Personal licence (most likely):"
          echo "     - set UNITY_LICENSE to the ENTIRE contents of your .ulf file"
          echo "     - DELETE UNITY_SERIAL if it exists (it forces the professional path)"
          echo ""
          echo "  B) Paid Pro/Plus licence:"
          echo "     - set all three of UNITY_SERIAL, UNITY_EMAIL, UNITY_PASSWORD"
          echo ""
          echo "See https://game.ci/docs/github/activation"
          exit 1

  unity-tests:
    name: EditMode tests (headless Unity editor)
    runs-on: ubuntu-latest
    needs: licence-check
    if: needs.licence-check.outputs.usable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-tests-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: unity-library-tests-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.22f1
          testMode: EditMode

  android-build:
    name: Android APK (headless Unity build)
    runs-on: ubuntu-latest
    needs: [core-tests, yaml-lint, licence-check]
    if: needs.licence-check.outputs.usable == 'true'
    steps:
      - name: Free runner disk space
        # IL2CPP Android builds are large; the hosted runner ships ~14 GB of
        # preinstalled toolchains this build never touches.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-android-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: unity-library-android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.22f1
          targetPlatform: Android
      - uses: actions/upload-artifact@v4
        with:
          name: battle-runner-android
          path: build/Android
